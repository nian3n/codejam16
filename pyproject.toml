[project]
name = "escape-pod"
version = "0.1.0"
description = "Two-player ASL bomb-defusal game for vocabulary practice (CodeJam 16)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "cryptography>=42",
]

[project.scripts]
escape-pod = "escape_pod.web.server:main"
build-manual = "escape_pod.manual.build:main"
answer-key = "escape_pod.manual.solve:main"
fetch-signs = "escape_pod.signs.fetch_popsign:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escape_pod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*httpx2.*"]
