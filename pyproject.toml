[project]
name = "escape-pod"
version = "0.1.0"
description = "Two-player ASL bomb-defusal game for vocabulary practice (CodeJam 16)"
readme = "README.md"
# <3.13 because mediapipe 0.10.21 (the last release with the Holistic "solutions" API
# that the sign model needs) has no wheels for 3.13.
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26,<2",
    "certifi>=2026.11.20",
]

[project.optional-dependencies]
# Sign recognition: uv sync --extra vision
# No Windows-on-ARM wheels for mediapipe/tensorflow: use an x64 Python there (README).
vision = [
    "mediapipe==0.10.21",
    "opencv-python>=4.9",
    "tensorflow-cpu>=2.16; sys_platform == 'win32'",
    "ai-edge-litert>=1.2; sys_platform != 'win32'",
]

[project.scripts]
escape-pod = "escape_pod.web.server:main"
build-manual = "escape_pod.manual.build:main"
answer-key = "escape_pod.manual.solve:main"
download-models = "escape_pod.vision.download:main"
sign-test = "escape_pod.vision.sign_test:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escape_pod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*httpx2.*"]
