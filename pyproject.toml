[project]
name = "ksne"
version = "0.1.0"
description = "Two-player ASL bomb-defusal game for vocabulary practice (CodeJam 16)"
readme = "README.md"
# <3.13 because mediapipe 0.10.21 (the last release with the Holistic "solutions" API
# that the sign model needs) has no wheels for 3.13.
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "cryptography>=42",
    "numpy>=1.26,<2",
]

[project.optional-dependencies]
# Only the TFLite runtime: what the server needs to score solo practice clips.
# The browser runs MediaPipe, so the deployed server needs no camera packages.
model = [
    "tensorflow-cpu>=2.16; sys_platform == 'win32'",
    "ai-edge-litert>=1.2; sys_platform != 'win32'",
    "onnx>=1.16,<1.18",
]
# The full desktop tools (sign-test, record-digits): uv sync --extra vision
# No Windows-on-ARM wheels for mediapipe/tensorflow: use an x64 Python there (README).
vision = [
    "mediapipe==0.10.21",
    "opencv-python>=4.9",
    "tensorflow-cpu>=2.16; sys_platform == 'win32'",
    "ai-edge-litert>=1.2; sys_platform != 'win32'",
    "onnx>=1.16,<1.18",
]

[project.scripts]
ksne = "web.server:main"
build-manual = "manual.build:main"
answer-key = "manual.solve:main"
fetch-signs = "signs.fetch_popsign:main"
download-models = "vision.download:main"
sign-test = "vision.sign_test:main"
record-digits = "vision.record_digits:main"
train-digits = "vision.train_digits:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*httpx2.*"]
